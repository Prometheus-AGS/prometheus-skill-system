name: Deterministic documentation synchronization

# Synchronization only. All quality work is completed locally before push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync-main
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Determine documentation inputs
        id: inputs
        run: node scripts/docs-sync.mjs --changed-between "${{ github.event.before || github.sha }}" "${{ github.sha }}"

      - name: Synchronize managed documentation
        run: npm run docs:sync

      - name: Publish managed update
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_INPUTS_CHANGED: ${{ steps.inputs.outputs.relevant }}
        run: |
          if git diff --quiet -- docs/generated site/docs/operations/generated-reference.md; then
            echo "Managed documentation is synchronized (source inputs changed: ${SOURCE_INPUTS_CHANGED})."
            exit 0
          fi

          git config user.name "prometheus-docs-bot"
          git config user.email "prometheus-docs-bot@users.noreply.github.com"
          git switch -C automation/docs-sync
          git add -- docs/generated site/docs/operations/generated-reference.md
          git commit -m "docs: synchronize generated references"
          git fetch origin automation/docs-sync:refs/remotes/origin/automation/docs-sync || true
          git push --force-with-lease origin HEAD:automation/docs-sync

          pr_url="$(gh pr list --head automation/docs-sync --base main --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head automation/docs-sync \
              --title "docs: synchronize generated references" \
              --body "Deterministic managed-block update generated by \`npm run docs:sync\`. Runtime quality work remains local.")"
          fi
          gh pr merge --auto --squash "$pr_url"
