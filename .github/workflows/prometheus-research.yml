name: Prometheus Research Rust

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prometheus-research.yml"
      - "substrate/prometheus-research/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/prometheus-research.yml"
      - "substrate/prometheus-research/**"

jobs:
  rust:
    name: prometheus-research / ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - fmt
          - clippy
          - test
    defaults:
      run:
        working-directory: substrate/prometheus-research
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            substrate/prometheus-research/target
          key: prometheus-research-${{ runner.os }}-${{ matrix.command }}-${{ hashFiles('substrate/prometheus-research/Cargo.lock') }}
          restore-keys: |
            prometheus-research-${{ runner.os }}-

      - name: cargo fmt --check
        if: matrix.command == 'fmt'
        run: cargo fmt --check

      - name: cargo clippy
        if: matrix.command == 'clippy'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        if: matrix.command == 'test'
        run: cargo test --all-targets --all-features

  ci-smoke:
    name: prometheus-research / ci-smoke (hosted UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: substrate/prometheus-research
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            substrate/prometheus-research/target
          key: prometheus-research-${{ runner.os }}-release-${{ hashFiles('substrate/prometheus-research/Cargo.lock') }}
          restore-keys: |
            prometheus-research-${{ runner.os }}-

      - name: cargo build --release
        run: cargo build --release

      - name: Start prometheus-research --mode server
        run: |
          ./target/release/prometheus-research --mode server --port 7899 > /tmp/prometheus-research-smoke.log 2>&1 &
          echo $! > /tmp/prometheus-research-smoke.pid

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7899/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::prometheus-research never became healthy on :7899"
          cat /tmp/prometheus-research-smoke.log
          exit 1

      - name: Assert hosted UI routes return 200 + non-empty body
        run: |
          set -e
          check() {
            local path="$1" code size
            code="$(curl -s -o /tmp/smoke-body -w '%{http_code}' "http://127.0.0.1:7899${path}")"
            size="$(wc -c < /tmp/smoke-body)"
            echo "GET ${path} -> ${code}, ${size} bytes"
            if [ "$code" != "200" ]; then
              echo "::error::GET ${path} returned HTTP ${code}, expected 200"
              exit 1
            fi
            if [ "$size" -eq 0 ]; then
              echo "::error::GET ${path} returned an empty body"
              exit 1
            fi
          }
          check "/"
          check "/static/htmx.min.js"
          check "/brand/primary-light.svg"

      - name: Stop prometheus-research
        if: always()
        run: |
          if [ -f /tmp/prometheus-research-smoke.pid ]; then
            kill "$(cat /tmp/prometheus-research-smoke.pid)" 2>/dev/null || true
          fi
