name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate AgentSkills.io Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate all skills
        run: npm run validate

      - name: Lint progress-signal declarations
        run: npm run validate:signals

      - name: Validate Codex plugin artifacts are in sync
        run: npm run validate:codex

      - name: Test kbd-next-phase installed packaging
        run: bash shared/scripts/tests/test-kbd-next-phase-packaging.sh

      - name: Test complete cross-tool skill payload copies
        run: bash shared/scripts/tests/test-cross-tool-skill-payloads.sh

  lint:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run check-format

  hooks-integrity:
    name: Check hooks.json symlink integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify .claude-plugin/hooks is a directory symlink to ../hooks
        run: |
          test -L .claude-plugin/hooks || (echo "FAIL: .claude-plugin/hooks is not a symlink" && exit 1)
          test -f hooks/hooks.json || (echo "FAIL: hooks/hooks.json (canonical) does not exist" && exit 1)
          echo "OK: .claude-plugin/hooks -> ../hooks; hooks/hooks.json is present"

  fabric-invariants:
    name: Fabric version invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Two of the three sibling repos are PUBLIC and are checked out here, so
      # the invariants that depend on them are genuinely verified in CI rather
      # than skipped.
      #
      # know-me-system is deliberately NOT checked out: it is PRIVATE and lives
      # in a different org (Know-Me-Tools/know-me-system). Adding a PAT to reach
      # it would put a cross-org credential in this workflow to check two
      # version strings — a poor trade. Its two invariants report SKIP, which is
      # honest, and the limit is stated in the skill's SKILL.md.
      - name: Check out flint-realtime-fabric (public)
        uses: actions/checkout@v4
        with:
          repository: Prometheus-AGS/flint-realtime-fabric
          path: .siblings/flint-realtime-fabric

      - name: Check out universal-agent-runtime (public)
        uses: actions/checkout@v4
        with:
          repository: Prometheus-AGS/universal-agent-runtime
          path: .siblings/universal-agent-runtime

      - name: Check fabric version invariants
        env:
          FRF_ROOT: ${{ github.workspace }}/.siblings/flint-realtime-fabric
          UAR_ROOT: ${{ github.workspace }}/.siblings/universal-agent-runtime
          # Deliberately points nowhere: know-me-system is private and out of
          # org. Naming a path that does not exist makes the SKIP explicit
          # rather than letting the script fall back to a sibling directory that
          # happens to exist on a developer machine but never on a runner.
          KNOWME_ROOT: ${{ github.workspace }}/.siblings/absent-know-me-system
        run: bash skills/devops/fabric-integration/scripts/check-invariants.sh

      # Pin the coverage we actually get, so it cannot silently regress. SKIP is
      # honest, but a SKIP that appears unnoticed is how coverage rots.
      - name: Assert expected invariant coverage (2 verified, 2 skipped)
        env:
          FRF_ROOT: ${{ github.workspace }}/.siblings/flint-realtime-fabric
          UAR_ROOT: ${{ github.workspace }}/.siblings/universal-agent-runtime
          KNOWME_ROOT: ${{ github.workspace }}/.siblings/absent-know-me-system
        run: bash skills/devops/fabric-integration/scripts/assert-ci-coverage.sh

      - name: Check mobile-execution classification has not drifted
        run: bash skills/process/adversarial-review/scripts/classify-mobile-execution.sh --check

  kbd-control-plane:
    name: KBD control plane (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Ensure jq and shellcheck are installed
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            # libdbus-1-dev: kbd-runtime's keyring dependency uses the Secret
            # Service backend on Linux and links libdbus. macOS uses its native
            # keychain, so this is Linux-only.
            sudo apt-get install -y jq shellcheck libdbus-1-dev pkg-config
          else
            command -v jq >/dev/null 2>&1 || brew install jq
            command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
          fi

      - name: Run state, hook, lifecycle, migration, eval, and clean-install contracts
        env:
          BASH_BIN: /bin/bash
        run: /bin/bash scripts/test-kbd-control-plane.sh

      - name: Shellcheck control-plane scripts
        run: |
          shellcheck \
            scripts/test-kbd-control-plane.sh \
            scripts/install-skills-flat.sh \
            shared/scripts/kbd-harness-adapter.sh \
            shared/scripts/position-stop-gate.sh \
            shared/scripts/tests/test-clean-install-parity.sh

      - name: Test canonical KBD runtime
        run: cargo test --manifest-path substrate/kbd-runtime/Cargo.toml

      - name: Test durable Raft control plane
        run: cargo test --manifest-path substrate/sovereign-sync/Cargo.toml --lib

      - name: Check Prometheus CLI control surfaces
        run: cargo check --manifest-path tools/prometheus-cli/Cargo.toml -p prometheus-cli

  rust-cli:
    name: Check Rust CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/prometheus-cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # kbd-runtime depends on keyring, which on Linux uses the Secret Service
      # backend and links against libdbus. Without the -dev package the
      # libdbus-sys build script fails at pkg_config before any of our code
      # compiles. macOS and Windows use their native keychains and need nothing.
      - name: Install Linux keyring build dependencies
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cargo check (default features only)
        run: cargo check
        env:
          # Git deps (dspy, prometheus-knowledge) are optional features.
          # Default build compiles without them — no external repo access needed.
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Cargo clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true

  sycophancy-gate:
    name: Build sycophancy binary + real gate e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      # See the note in check-rust-cli: the Linux keyring backend links libdbus.
      - name: Install Linux keyring build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build sycophancy-correction binary
        id: build
        working-directory: skills/imported/sycophancy-correction
        run: cargo build --release
        continue-on-error: true

      - name: Real end-to-end artifact-gate test
        if: steps.build.outcome == 'success'
        env:
          # Point the gate's binary discovery at the freshly built release binary.
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
          PROMETHEUS_REFLECT_STRICTNESS: strict
        run: bash shared/scripts/tests/test-sycophancy-gate-e2e.sh

      - name: Note when submodule absent
        if: steps.build.outcome != 'success'
        run: echo "::warning::sycophancy-correction submodule not built (likely not checked out) — real gate e2e skipped"

  forge-rs-test:
    name: forge-rs (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/forge-rs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/forge-rs/target/
          key: forge-rs-${{ runner.os }}-cargo-${{ hashFiles('tools/forge-rs/Cargo.lock') }}
          restore-keys: forge-rs-${{ runner.os }}-cargo-

      - name: fmt
        run: cargo fmt --check --all

      - name: clippy
        run: cargo clippy --all --all-features -- -D warnings

      - name: test
        run: cargo test --all

  bdd-skill-smoke:
    name: BDD skill smoke tests (bdd-cucumber-{js,rs} / lifecycle-loop / video-proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Ensure jq is installed
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y jq
          fi

      - name: Run smoke tests for all four BDD skills
        run: |
          set -e
          for skill in bdd-cucumber-js bdd-cucumber-rs bdd-lifecycle-loop bdd-video-proof; do
            echo "=== $skill ==="
            bash "skills/testing/$skill/scripts/smoke-test.sh"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install skill-pack dependencies (for validate:strict)
        run: npm ci --ignore-scripts

      - name: Strict validate all four BDD skills
        run: |
          set -e
          for skill in bdd-cucumber-js bdd-cucumber-rs bdd-lifecycle-loop bdd-video-proof; do
            echo "=== strict: $skill ==="
            npm run validate:strict "skills/testing/$skill"
          done

  bdd-test:
    name: BDD tests (forge validate + enrich)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/forge-rs/target/
          key: forge-rs-bdd-${{ runner.os }}-cargo-${{ hashFiles('tools/forge-rs/Cargo.lock') }}
          restore-keys: forge-rs-bdd-${{ runner.os }}-cargo-

      - name: Build forge binary
        run: cargo build --manifest-path tools/forge-rs/Cargo.toml

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Run BDD scenarios
        run: npm run cucumber
        env:
          # Absolute path: the cucumber steps spawn forge with cwd set to a temp
          # workdir, so a relative FORGE_BIN would resolve against that temp dir
          # (ENOENT → spawnSync status null). Must be absolute.
          FORGE_BIN: ${{ github.workspace }}/tools/forge-rs/target/debug/forge

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    # Runs the MIT-licensed gitleaks CLI directly instead of
    # gitleaks/gitleaks-action@v2, which requires a paid GITLEAKS_LICENSE
    # secret for organization-owned repos. The CLI needs no license and
    # scans the full commit history the same way.
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: |
          # --redact: never print secret values in logs.
          # Exits non-zero only on a real finding; the repo history is
          # currently clean, so this passes until a secret is introduced.
          gitleaks git . --redact --verbose \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload gitleaks SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  skill-collision:
    name: Skill description collision detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run skill-matrix collision check
        run: node scripts/skill-matrix.js --ci

  learn-grade-regression:
    name: learn-grade eval snapshot regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check for python3
        run: python3 --version

      - name: Run grader regression test (schema + pass/fail snapshot compare)
        run: |
          bash skills/learn/learn-grade/references/eval-dataset/grader-regression-test.sh

      # NOTE: this job intentionally does NOT re-invoke the LLM grader.
      # learn-grade is prose-executed (an agent following SKILL.md), not a
      # deterministic script — live re-grading in CI would be expensive and
      # non-deterministic (a pass today could fail tomorrow from model
      # sampling variance alone). This job only diffs the *shape* and
      # *pass/fail status* of results/ against baseline-snapshot.json,
      # catching harness/schema regressions and coarse behavior flips.
      # Periodic live re-validation (actually re-running the 24-item eval
      # suite through the grader) is a manual, human-reviewed step — see
      # skills/learn/learn-grade/references/eval-dataset/EVAL-RESULTS.md.

  learner-model-runtime:
    name: learner-model JSON-RPC and FSRS runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test learner-model crate
        run: cargo test --manifest-path substrate/learner-model/Cargo.toml

      - name: Test real learner-model skill contract
        run: bash tests/learn/integration-learner-runtime.sh

  tool-submodules:
    name: Check tool submodules (cowork-skills + disk-space-guardian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT use submodules: true here — it recursively checks out all
          # submodules including heavy ones (prometheus-knowledge, liter-llm, etc.).
          # Instead, initialize only the two tool submodules we need to verify.
          submodules: false

      - name: Initialize tool submodules
        run: |
          git submodule update --init tools/disk-space-guardian tools/cowork-skills

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: tool-submodules-${{ runner.os }}-cargo-${{ hashFiles('tools/cowork-skills/cli/Cargo.lock', 'tools/disk-space-guardian/Cargo.lock') }}
          restore-keys: tool-submodules-${{ runner.os }}-cargo-

      - name: cargo check — cowork-skills CLI
        # cowork-skills has a Cargo.toml under cli/; verify it compiles cleanly.
        working-directory: tools/cowork-skills/cli
        run: cargo check
        continue-on-error: true

      - name: cargo check — disk-space-guardian
        # disk-space-guardian may be spec-only (no Cargo.toml yet).
        # This step is skipped when Cargo.toml is absent.
        run: |
          if [ -f tools/disk-space-guardian/Cargo.toml ]; then
            cargo check --manifest-path tools/disk-space-guardian/Cargo.toml
          else
            echo "::notice::tools/disk-space-guardian has no Cargo.toml yet (spec-only) — skipping cargo check"
          fi
        continue-on-error: true
