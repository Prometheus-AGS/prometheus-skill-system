# cargo-nextest profile. Point a run at it with:
#   cargo nextest run --config-file config/nextest.toml
#
# nextest was already installed on this machine but no config selected it.
# Unlike `cargo test`, nextest runs each test in its own process, which matters
# here: several suites touch shared state (~/.prometheus, sockets, launchd
# labels), and process isolation turns cross-test interference into a real
# failure instead of an order-dependent flake.

[profile.default]
# Leave one core for the compiler/linker so a test run does not starve a
# concurrent build.
test-threads = "num-cpus"

# Do not paper over flakes. A retried test that passes is still a defect, and
# the BDD immutable-tests rule depends on failures staying visible.
retries = 0

# Surface a hang as a failure rather than letting CI-equivalent local runs sit.
# Some substrate tests spawn child processes and daemons, so the window is
# generous but bounded.
slow-timeout = { period = "60s", terminate-after = 3 }

# Report every failure in one pass instead of stopping at the first.
fail-fast = false

[profile.ci]
# Not for hosted CI -- CLAUDE.md mandates local-only validation. This is the
# profile for a full local certification run.
test-threads = "num-cpus"
retries = 0
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 3 }
