[package]
name = "prometheus-exec"
version = "1.7.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Evidence-producing code execution service for Prometheus"

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prometheus-exec-contracts = { path = "../../substrate/exec-contracts", version = "1.7.0" }
prometheus-exec-core = { path = "../../substrate/exec-core", version = "1.7.0" }
prometheus-exec-service = { path = "../../substrate/exec-service", version = "1.7.0" }
prometheus-exec-tier-p = { path = "../../substrate/exec-tier-p", version = "1.7.0" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
