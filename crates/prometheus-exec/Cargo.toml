[package]
name = "prometheus-exec"
version = "1.7.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Evidence-producing code execution service for Prometheus"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
prometheus-exec-contracts = { path = "../../substrate/exec-contracts", version = "1.7.0" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
