# Which stack rule files (rules/src/tech/<name>.md) this project renders. Domain and project rules always render.
stacks="__STACKS__"

# Nested AGENTS.md for harnesses without path-scoped rules: <dir>:<source>,<source>… Rendered only if <dir> exists.
# Example: nested="web:tech/typescript-react,domain/architecture server:tech/rust,domain/architecture,domain/security-boundaries"
nested=""

# Set to yes (or pass --with-cursor) to render .cursor/rules/*.mdc as well.
cursor="no"
