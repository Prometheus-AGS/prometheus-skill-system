[package]
name = "knowme-builder"
version = "2.0.0-alpha.4"
edition = "2024"
rust-version = "1.97.1"
description = "Non-destructive application generator and instruction pack for governed agentic applications"
license = "MIT"
repository = "https://github.com/Know-Me-Tools/hybrid-mobile-architecture-skill"

[dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.54", features = ["derive", "env"] }
clap_complete = "=4.5.65"
dirs-next = "=2.0.0"
include_dir = "=0.7.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
toml = "=0.9.8"
walkdir = "=2.5.0"

[dev-dependencies]
assert_cmd = "=2.1.1"
predicates = "=3.1.3"

[lib]
name = "knowme_builder"
path = "src/lib.rs"

[[bin]]
name = "knowme-builder"
path = "src/main.rs"
