[package]
name = "bdd-cucumber-rs-example-http"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dev-dependencies]
cucumber = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "features"
harness = false
