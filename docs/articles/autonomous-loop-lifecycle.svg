<svg viewBox="0 0 760 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Autonomous loop lifecycle flowchart: you write a loop definition, the loop runner triggers on a schedule or event, prompts an AI agent with current context, the agent executes tools code tests and search, then a goal-condition check either loops back through a feedback source or terminates and writes a session summary to memory, enriches the knowledge base, and proposes skill-update candidates">
  <style>
    :root {
    --bg:#0B0F14; --diagram-canvas:#0E151D;
    --text:#E8EEF4; --text-dim:#9DB0C2; --text-faint:#768494;
    --node-bg:#1A2632; --node-bg-2:#213140; --decision-bg:#25384A;
    --edge:#5E768C; --accent:#E96A12; --accent-2:#F49E12; --node-accent-text:#0B0F14;
}
    @media (prefers-color-scheme: light) {
      :root {
      --bg:#F6F4F1; --diagram-canvas:#ECEFF2;
      --text:#1A2129; --text-dim:#51606E; --text-faint:#768494;
      --node-bg:#E1E7ED; --node-bg-2:#D5DDE5; --decision-bg:#DBE3EB;
      --edge:#8295A6; --accent:#CE3012; --accent-2:#B5740A; --node-accent-text:#FFFFFF;
}
    }
    svg { background: var(--diagram-canvas); }

  .dg-node{fill:var(--node-bg);} .dg-node2{fill:var(--node-bg-2);}
  .dg-accent{fill:var(--accent);} .dg-accent2{fill:var(--accent-2);}
  .dg-decision{fill:var(--decision-bg);}
  .dg-text{fill:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:13.5px;font-weight:500;}
  .dg-text-accent{fill:var(--node-accent-text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:13.5px;font-weight:600;}
  .dg-elabel{fill:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:11.5px;}
  .dg-edge{fill:none;stroke:var(--edge);stroke-width:1.8;}
  .dg-edge-accent{fill:none;stroke:var(--accent);stroke-width:2;}
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" style="fill:var(--edge)"/></marker>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" style="fill:var(--accent)"/></marker>
  </defs>
  <rect x="90" y="24" width="320" height="54" rx="11" class="dg-accent"/>
  <text x="250" y="56" text-anchor="middle" class="dg-text-accent">You write a loop definition</text>
  <rect x="90" y="108" width="320" height="54" rx="11" class="dg-node"/>
  <text x="250" y="129" text-anchor="middle" class="dg-text">Loop runner triggers</text>
  <text x="250" y="147" text-anchor="middle" class="dg-text">on schedule or event</text>
  <rect x="90" y="192" width="320" height="54" rx="11" class="dg-node"/>
  <text x="250" y="213" text-anchor="middle" class="dg-text">Loop prompts AI agent</text>
  <text x="250" y="231" text-anchor="middle" class="dg-text">with current context</text>
  <rect x="90" y="276" width="320" height="54" rx="11" class="dg-node"/>
  <text x="250" y="297" text-anchor="middle" class="dg-text">Agent executes —</text>
  <text x="250" y="315" text-anchor="middle" class="dg-text">tools, code, tests, search</text>
  <rect x="90" y="470" width="320" height="54" rx="11" class="dg-node"/>
  <text x="250" y="502" text-anchor="middle" class="dg-text">Loop terminates or escalates</text>
  <rect x="90" y="554" width="320" height="54" rx="11" class="dg-node"/>
  <text x="250" y="586" text-anchor="middle" class="dg-text">Session summary written to memory</text>
  <rect x="90" y="638" width="320" height="54" rx="11" class="dg-node"/>
  <text x="250" y="670" text-anchor="middle" class="dg-text">KB enriched for next session</text>
  <rect x="90" y="722" width="320" height="54" rx="11" class="dg-accent2"/>
  <text x="250" y="754" text-anchor="middle" class="dg-text-accent">Skill-update candidates proposed</text>
  <polygon points="250,348 332,390 250,432 168,390" class="dg-decision"/>
  <text x="250" y="395" text-anchor="middle" class="dg-text">Goal condition met?</text>
  <rect x="470" y="363" width="250" height="54" rx="11" class="dg-node2"/>
  <text x="595" y="396" text-anchor="middle" class="dg-text">Feedback source evaluated</text>
  <path d="M250,78 L250,108" class="dg-edge" marker-end="url(#ar)"/>
  <path d="M250,162 L250,192" class="dg-edge" marker-end="url(#ar)"/>
  <path d="M250,246 L250,276" class="dg-edge" marker-end="url(#ar)"/>
  <path d="M250,330 L250,348" class="dg-edge" marker-end="url(#ar)"/>
  <path d="M250,432 L250,470" class="dg-edge" marker-end="url(#ar)"/>
  <text x="262" y="454" class="dg-elabel">Yes</text>
  <path d="M250,524 L250,554" class="dg-edge" marker-end="url(#ar)"/>
  <path d="M250,608 L250,638" class="dg-edge" marker-end="url(#ar)"/>
  <path d="M250,692 L250,722" class="dg-edge" marker-end="url(#ar)"/>
  <path d="M332,390 L470,390" class="dg-edge" marker-end="url(#ar)"/>
  <text x="362" y="382" class="dg-elabel">No</text>
  <path d="M595,363 L595,130 L410,130" class="dg-edge-accent" stroke-dasharray="6 4" marker-end="url(#arA)"/>
  <text x="605" y="250" class="dg-elabel" style="fill:var(--accent)">feedback loop</text>
</svg>
