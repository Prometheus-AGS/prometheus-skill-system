<svg viewBox="0 0 1040 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flowchart of the KBD and iterative-evolver cycle: a KBD inner loop completes a phase, evolver-bridge.json maps the phase to an evolution item, iterative-evolver reads completion status, and a decision checks whether all evolution goals are met. If not, a compile, evaluate, optimize loop generates the next KBD phase plan and returns to the start; if yes, it promotes by updating the knowledge base and proposing skill updates">
  <style>
    :root {
      --diagram-canvas:#0E151D;
      --text:#E8EEF4;
      --text-faint:#9DB0C2;
      --node-bg:#1A2632;
      --node-bg-2:#213140;
      --decision-bg:#25384A;
      --edge:#5E768C;
      --accent:#E96A12;
      --accent-2:#F49E12;
      --node-accent-text:#0B0F14;
    }
    @media (prefers-color-scheme: light) { :root {
      --diagram-canvas:#ECEFF2;
      --text:#1A2129;
      --text-faint:#5A6B7A;
      --node-bg:#E1E7ED;
      --node-bg-2:#D5DDE5;
      --decision-bg:#DBE3EB;
      --edge:#8295A6;
      --accent:#CE3012;
      --accent-2:#B5740A;
      --node-accent-text:#FFFFFF;
    } }

  .dg-node{fill:var(--node-bg);} .dg-node2{fill:var(--node-bg-2);}
  .dg-accent{fill:var(--accent);} .dg-accent2{fill:var(--accent-2);} .dg-decision{fill:var(--decision-bg);}
  .dg-text-sm{fill:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:12.5px;font-weight:600;}
  .dg-text-xs{fill:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:10.5px;}
  .dg-text-accent{fill:var(--node-accent-text);font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:700;}
  .dg-elabel{fill:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .dg-kicker{fill:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;}
  .dg-edge{fill:none;stroke:var(--edge);stroke-width:1.8;}
  .dg-edge-accent{fill:none;stroke:var(--accent);stroke-width:2;}
  </style>
  <defs>
    <marker id="gr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" style="fill:var(--edge)"/></marker>
    <marker id="grA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" style="fill:var(--accent)"/></marker>
  </defs>
  <rect x="22" y="58" width="176" height="58" rx="11" class="dg-accent"/>
  <text x="110" y="84" text-anchor="middle" class="dg-text-accent">KBD inner loop</text>
  <text x="110" y="101" text-anchor="middle" class="dg-text-accent" style="font-weight:500">completes phase</text>
  <rect x="242" y="58" width="176" height="58" rx="11" class="dg-node"/>
  <text x="330" y="84" text-anchor="middle" class="dg-text-sm">evolver-bridge.json</text>
  <text x="330" y="100" text-anchor="middle" class="dg-text-xs">phase → evolution item</text>
  <rect x="462" y="58" width="176" height="58" rx="11" class="dg-node"/>
  <text x="550" y="84" text-anchor="middle" class="dg-text-sm">iterative-evolver</text>
  <text x="550" y="100" text-anchor="middle" class="dg-text-xs">reads completion status</text>
  <polygon points="770,43 856,87 770,131 684,87" class="dg-decision"/>
  <text x="770" y="84" text-anchor="middle" class="dg-text-sm">All evolution</text>
  <text x="770" y="100" text-anchor="middle" class="dg-text-sm">goals met?</text>
  <rect x="860" y="150" width="176" height="58" rx="11" class="dg-accent2"/>
  <text x="948" y="176" text-anchor="middle" class="dg-text-accent">Promote —</text>
  <text x="948" y="193" text-anchor="middle" class="dg-text-accent" style="font-weight:500">update KB + skills</text>
  <rect x="682" y="271" width="176" height="58" rx="11" class="dg-node2"/>
  <text x="770" y="297" text-anchor="middle" class="dg-text-sm">Compile —</text>
  <text x="770" y="313" text-anchor="middle" class="dg-text-xs">identify remaining gaps</text>
  <rect x="352" y="271" width="176" height="58" rx="11" class="dg-node2"/>
  <text x="440" y="297" text-anchor="middle" class="dg-text-sm">Evaluate —</text>
  <text x="440" y="313" text-anchor="middle" class="dg-text-xs">score state vs goals</text>
  <rect x="22" y="271" width="176" height="58" rx="11" class="dg-node2"/>
  <text x="110" y="297" text-anchor="middle" class="dg-text-sm">Optimize —</text>
  <text x="110" y="313" text-anchor="middle" class="dg-text-xs">next KBD phase plan</text>
  <text x="440" y="252" text-anchor="middle" class="dg-kicker">ITERATIVE-EVOLVER LOOP · COMPILE → EVALUATE → OPTIMIZE</text>
  <path d="M198,87 L242,87" class="dg-edge" marker-end="url(#gr)"/>
  <path d="M418,87 L462,87" class="dg-edge" marker-end="url(#gr)"/>
  <path d="M638,87 L684,87" class="dg-edge" marker-end="url(#gr)"/>
  <path d="M856,87 L948,87 L948,150" class="dg-edge" marker-end="url(#gr)"/>
  <text x="868" y="80" class="dg-elabel">Yes</text>
  <path d="M770,131 L770,271" class="dg-edge" marker-end="url(#gr)"/>
  <text x="780" y="200" class="dg-elabel">No</text>
  <path d="M682,300 L528,300" class="dg-edge" marker-end="url(#gr)"/>
  <path d="M352,300 L198,300" class="dg-edge" marker-end="url(#gr)"/>
  <path d="M110,271 L110,116" class="dg-edge-accent" stroke-dasharray="6 4" marker-end="url(#grA)"/>
  <text x="120" y="200" class="dg-elabel" style="fill:var(--accent)">next phase</text>
</svg>
