<svg viewBox="0 0 884 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sequence diagram: the operator issues a goal to the Loop Runner, which creates an isolated git worktree, then loops until the goal is met — executing the Claude Code agent, which makes changes and runs tests, while a fast Goal Checker model checks the condition and reports met or not met; on completion the runner writes a session summary to surreal-memory, notifies the operator, and the worktree auto-cleans">
  <style>
    :root {
    --diagram-canvas:#0E151D; --text:#E8EEF4; --text-faint:#9DB0C2;
    --node-bg-2:#213140; --band:#131C26; --edge:#5E768C; --accent:#E96A12; --node-accent-text:#0B0F14;
}
    @media (prefers-color-scheme: light) { :root {
      --diagram-canvas:#ECEFF2; --text:#1A2129; --text-faint:#5A6B7A;
      --node-bg-2:#D5DDE5; --band:#E3E8EE; --edge:#8295A6; --accent:#CE3012; --node-accent-text:#FFFFFF;
} }

  .dg-node2{fill:var(--node-bg-2);} .dg-accent{fill:var(--accent);} .dg-band{fill:var(--band);}
  .dg-lifeline{stroke:var(--edge);stroke-width:1.3;stroke-dasharray:4 4;fill:none;}
  .dg-text-sm{fill:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:12.5px;font-weight:500;}
  .dg-text-xs{fill:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .dg-text-accent{fill:var(--node-accent-text);font-family:'Space Grotesk',sans-serif;font-weight:600;}
  .dg-elabel{fill:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .dg-edge{fill:none;stroke:var(--edge);stroke-width:1.7;}
  </style>
  <defs>
    <marker id="sa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" style="fill:var(--edge)"/></marker>
  </defs>
  <rect x="158" y="164" width="558" height="200" rx="12" class="dg-band"/>
  <path d="M72,58 L72,486" class="dg-lifeline"/>
  <path d="M218,58 L218,486" class="dg-lifeline"/>
  <path d="M364,58 L364,486" class="dg-lifeline"/>
  <path d="M510,58 L510,486" class="dg-lifeline"/>
  <path d="M656,58 L656,486" class="dg-lifeline"/>
  <path d="M802,58 L802,486" class="dg-lifeline"/>
  <rect x="5" y="14" width="134" height="44" rx="9" class="dg-node2"/>
  <text x="72" y="34" text-anchor="middle" class="dg-text-sm">You</text>
  <text x="72" y="50" text-anchor="middle" class="dg-text-xs">(Operator)</text>
  <rect x="151" y="14" width="134" height="44" rx="9" class="dg-node2"/>
  <text x="218" y="42" text-anchor="middle" class="dg-text-sm">Loop Runner</text>
  <rect x="297" y="14" width="134" height="44" rx="9" class="dg-node2"/>
  <text x="364" y="34" text-anchor="middle" class="dg-text-sm">Goal Checker</text>
  <text x="364" y="50" text-anchor="middle" class="dg-text-xs">(fast model)</text>
  <rect x="443" y="14" width="134" height="44" rx="9" class="dg-node2"/>
  <text x="510" y="34" text-anchor="middle" class="dg-text-sm">Claude Code</text>
  <text x="510" y="50" text-anchor="middle" class="dg-text-xs">Agent</text>
  <rect x="589" y="14" width="134" height="44" rx="9" class="dg-node2"/>
  <text x="656" y="34" text-anchor="middle" class="dg-text-sm">Git Worktree</text>
  <text x="656" y="50" text-anchor="middle" class="dg-text-xs">(isolated)</text>
  <rect x="735" y="14" width="134" height="44" rx="9" class="dg-node2"/>
  <text x="802" y="42" text-anchor="middle" class="dg-text-sm">surreal-memory</text>
  <rect x="158" y="164" width="58" height="24" rx="7" class="dg-accent"/>
  <text x="187" y="181" text-anchor="middle" class="dg-text-accent" style="font-size:11.5px">loop</text>
  <text x="230" y="181" class="dg-elabel">[ Until goal met ]</text>
  <path d="M72,100 L218,100" class="dg-edge" marker-end="url(#sa)"/>
  <text x="145" y="91" text-anchor="middle" class="dg-elabel">/goal "all tests pass"</text>
  <path d="M218,136 L656,136" class="dg-edge" marker-end="url(#sa)"/>
  <text x="437" y="127" text-anchor="middle" class="dg-elabel">Create isolated worktree</text>
  <path d="M218,208 L510,208" class="dg-edge" marker-end="url(#sa)"/>
  <text x="364" y="199" text-anchor="middle" class="dg-elabel">Execute with current context</text>
  <path d="M510,242 L656,242" class="dg-edge" marker-end="url(#sa)"/>
  <text x="583" y="233" text-anchor="middle" class="dg-elabel">Make changes</text>
  <path d="M510,267 h30 v15 h-30" class="dg-edge" marker-end="url(#sa)"/>
  <text x="548" y="275" class="dg-elabel">Run tests, fix errors</text>
  <path d="M364,308 L656,308" class="dg-edge" marker-end="url(#sa)"/>
  <text x="510" y="299" text-anchor="middle" class="dg-elabel">Check goal condition</text>
  <path d="M364,342 L218,342" class="dg-edge" stroke-dasharray="5 4" marker-end="url(#sa)"/>
  <text x="291" y="333" text-anchor="middle" class="dg-elabel">Not met / Met</text>
  <path d="M218,396 L802,396" class="dg-edge" marker-end="url(#sa)"/>
  <text x="510" y="387" text-anchor="middle" class="dg-elabel">Write session summary</text>
  <path d="M218,428 L72,428" class="dg-edge" marker-end="url(#sa)"/>
  <text x="145" y="419" text-anchor="middle" class="dg-elabel">Notify completion</text>
  <path d="M656,453 h30 v15 h-30" class="dg-edge" marker-end="url(#sa)"/>
  <text x="694" y="461" class="dg-elabel">Auto-cleanup</text>
</svg>
