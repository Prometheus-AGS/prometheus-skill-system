  <text x="276" y="26"><tspan class="t-head">Claude</tspan><tspan class="t-head"> </tspan><tspan class="t-head">Code</tspan><tspan class="t-head"> </tspan><tspan class="t-head-code">/loop</tspan><tspan class="t-head"> </tspan><tspan class="t-head">alone</tspan></text>
  <text x="490" y="26"><tspan class="t-head-code">/loop</tspan><tspan class="t-head"> </tspan><tspan class="t-head">+</tspan><tspan class="t-head"> </tspan><tspan class="t-head">prometheus-skill-pack</tspan></text>
