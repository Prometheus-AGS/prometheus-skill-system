<svg viewBox="0 0 916 797" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison table of Claude Code /loop alone versus /loop with prometheus-skill-pack across fifteen capabilities. Both support repeating agent execution, goal-conditioned termination, worktree isolation, and a fleet dashboard. Only /loop with the skill-pack adds cross-session memory, context priming, an anti-sycophancy reflection gate, cross-tool support across seven tools, self-hosted Firecrawl web extraction, human-gated self-updating skills, structured KBD phase discipline, periodic background KB enrichment, a learning-log to skill-candidate pipeline, nested loops, and cross-context progress signals.">
  <style>
    :root {
      --rhead:#16212C;
      --ra:#0F1820;
      --rb:#131E28;
      --text:#E8EEF4;
      --dim:#C4D2DE;
      --cap:#E8EEF4;
      --code:#F49E12;
      --head:#E8EEF4;
      --good:#4FB477;
      --check:#0B1116;
      --no:#6E8398;
    }
    @media (prefers-color-scheme: light) { :root {
      --rhead:#E6E2DC;
      --ra:#F1EEE9;
      --rb:#E9E5DF;
      --text:#1A2129;
      --dim:#3E4A57;
      --cap:#1A2129;
      --code:#B5740A;
      --head:#1A2129;
      --good:#2E8B57;
      --check:#FFFFFF;
      --no:#93A2AF;
    } }

  .r-head{fill:var(--rhead);} .r-a{fill:var(--ra);} .r-b{fill:var(--rb);}
  .t-head{fill:var(--head);font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;}
  .t-head-code{fill:var(--code);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;}
  .t-cap{fill:var(--cap);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;}
  .t-body{fill:var(--dim);font-family:'Inter',sans-serif;font-size:13px;}
  .t-code{fill:var(--code);font-family:'JetBrains Mono',monospace;font-size:12px;}
  .m-yes{fill:var(--good);}
  .m-check{fill:none;stroke:var(--check);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
  .m-no{fill:none;stroke:var(--no);stroke-width:2.2;stroke-linecap:round;}
  </style>
