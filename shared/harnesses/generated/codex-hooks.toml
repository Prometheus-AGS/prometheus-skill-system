# Generated from shared/harnesses/capabilities.json.
[hooks.kbd_control]
command = ["bash", "${PROMETHEUS_SKILL_PACK_ROOT}/shared/scripts/kbd-harness-adapter.sh", "auto", "codex"]
events = ["session_start", "pre_compact", "post_compact", "turn_cancelled"]
timeout_ms = 250

[hooks.karpathy_learning]
command = ["bash", "$HOME/.prometheus/plugins/prometheus-skill-pack/stable/karpathy-hook-dispatch.sh", "auto", "codex"]
events = ["user_prompt_submit", "stop"]
