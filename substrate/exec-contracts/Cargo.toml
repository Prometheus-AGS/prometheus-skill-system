[package]
name = "prometheus-exec-contracts"
version = "1.7.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Portable signed execution evidence contracts for Prometheus"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
schemars = { version = "1.0", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
