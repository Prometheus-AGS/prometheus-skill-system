[package]
name = "prometheus-exec-remote"
version = "1.7.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Estate-only signed remote dispatch for Prometheus Exec"

[package.metadata.prometheus]
exec-layer = "remote"

[features]
default = []
transport = ["dep:async-trait"]

[dependencies]
async-trait = { version = "0.1", optional = true }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
fs2 = "0.4"
prometheus-exec-contracts = { path = "../exec-contracts", version = "1.7.0" }
schemars = { version = "1.0", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
