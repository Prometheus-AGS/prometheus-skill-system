[package]
name = "prometheus-exec-service"
version = "1.7.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Idempotent service layer for Prometheus Exec"

[package.metadata.prometheus]
exec-layer = "service"

[features]
local-client = ["dep:base64", "dep:bytes", "dep:ed25519-dalek", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:rand_core"]

[dependencies]
base64 = { version = "0.22", optional = true }
bytes = { version = "1", optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
prometheus-exec-contracts = { path = "../exec-contracts", version = "1.7.0" }
prometheus-exec-core = { path = "../exec-core", version = "1.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user"] }

[dev-dependencies]
ed25519-dalek = "2"
proptest = "1"
tower = { version = "0.5", features = ["util"] }
