[package]
name = "prometheus-exec-tier-w"
version = "1.7.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "Deterministic Wasm component adapter for Prometheus Exec"

[package.metadata.prometheus]
exec-layer = "tier-w"
component-world = "prometheus:component@0.1.0"

[features]
default = ["cranelift"]
cranelift = []
pulley = ["wasmtime/pulley"]
estate = []
standalone = []
mobile = ["pulley"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
ed25519-dalek = "2"
prometheus-exec-contracts = { path = "../exec-contracts", version = "1.7.0" }
prometheus-exec-core = { path = "../exec-core", version = "1.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wasmtime = { version = "=46.0.0", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=46.0.0", default-features = false, features = ["p2"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
wat = "1"
