[package]
name = "prometheus-exec-tier-w"
version = "1.7.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "Deterministic Wasm component adapter for Prometheus Exec"

[package.metadata.prometheus]
exec-layer = "tier-w"
component-world = "prometheus:component@0.1.0"

[features]
default = ["cranelift"]
# Selects the native-execution profile. Wasmtime's Cranelift compiler support
# remains available in Pulley builds because it translates source components to
# Pulley bytecode; the mobile profile still executes only through the Pulley
# interpreter and never permits executable-memory JIT.
cranelift = []
pulley = ["wasmtime/pulley"]
estate = ["dep:base64", "dep:ed25519-dalek", "dep:serde_json"]
standalone = ["cranelift"]
mobile = ["pulley"]
bundled-mobile = ["mobile"]

[dependencies]
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
chrono = "0.4"
ed25519-dalek = { version = "2", optional = true }
prometheus-exec-contracts = { path = "../exec-contracts", version = "1.7.0" }
prometheus-exec-core = { path = "../exec-core", version = "1.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
thiserror = "2"
wasmtime = { version = "=46.0.0", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=46.0.0", default-features = false, features = ["p2"] }

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2"
proptest = "1"
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
wat = "1"
