[package]
name = "learner-model"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "learner-model"
path = "src/main.rs"

[lib]
name = "learner_model"
path = "src/lib.rs"

[dependencies]
storage-provider = { path = "../storage-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
shellexpand = "3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempdir = "0.3"
