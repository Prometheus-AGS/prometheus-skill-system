[package]
name = "sovereign-client"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for connecting to a sovereign-sync node (REST + SSE)"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
url = "2"
bytes = "1"
eventsource-stream = "0.2"
kbd-runtime = { path = "../kbd-runtime" }
