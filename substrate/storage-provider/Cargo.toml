[package]
name = "storage-provider"
version = "0.1.0"
edition = "2021"

[dependencies]
# Keep the compatible Loro release paired with the owner-local internal patch.
loro = "=1.13.9"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rt-multi-thread does not exist on wasm32 — tokio hard-errors on it.
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[patch.crates-io]
heapless = { path = "../../vendor/patches/heapless-0.7.17" }
loro-internal = { path = "../../vendor/patches/loro-internal-1.13.9" }
