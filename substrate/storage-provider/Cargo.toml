[package]
name = "storage-provider"
version = "0.1.0"
edition = "2021"

[dependencies]
loro = "1.13"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
bytes = "1"
futures = "0.3"
iroh = "1.0"
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
iroh-docs = { version = "0.101", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
n0-future = "0.3.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
