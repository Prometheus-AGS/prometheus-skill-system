[package]
name = "storage-provider"
version = "0.1.0"
edition = "2021"

[dependencies]
loro = "1.13"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"

# The iroh stack is native-only: it needs UDP sockets and a multi-thread runtime,
# neither of which exists in a wasm32 sandbox. Gated behind `iroh-docs` (default-on)
# so a native build is unchanged while wasm32 can opt out with --no-default-features.
#
# iroh floor is 1.0.2, not 1.0: 1.0.2 fixed a relay DoS where a single malformed
# datagram from any client crashed an entire relay — every peer using it lost
# connectivity, so this is a floor rather than a preference.
iroh = { version = "1.0.2", optional = true }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"], optional = true }
iroh-docs = { version = "0.101", default-features = false, features = ["fs-store"], optional = true }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"], optional = true }
n0-future = { version = "0.3.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rt-multi-thread does not exist on wasm32 — tokio hard-errors on it.
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[features]
default = ["iroh-docs-backend"]
iroh-docs-backend = ["dep:iroh", "dep:iroh-blobs", "dep:iroh-docs", "dep:iroh-gossip", "dep:n0-future"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
