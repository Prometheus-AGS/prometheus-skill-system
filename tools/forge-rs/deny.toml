# cargo-deny configuration for forge-rs workspace
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Treat most advisories as errors
version = 2
ignore = [
    # instant v0.1.13 — RUSTSEC-2024-0384 (unmaintained)
    # Transitive dep: notify-types → notify v7 → pk-watcher (external git dep).
    # We cannot upgrade this without bumping the prometheus-knowledge-rs upstream.
    # Track: https://github.com/Prometheus-AGS/prometheus-knowledge-rs (upgrade notify v7 → v8+)
    { id = "RUSTSEC-2024-0384", reason = "Transitive via pk-watcher/notify-types; no direct upgrade path within forge-rs" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = [
    "https://github.com/Prometheus-AGS/prometheus-knowledge-rs",
]
