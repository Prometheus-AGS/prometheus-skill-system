[workspace]
resolver = "2"
members = [
    "crates/prometheus-cli",
    "crates/prometheus-agents",
    "crates/prometheus-learn",
    "crates/prometheus-cedar",
]
exclude = ["vendor/dspy/crates/dspy", "vendor/dspy/crates/dspy-core"]

[workspace.package]
version = "1.12.2"
edition = "2021"
authors = ["Travis James <tjames@prometheusags.ai>"]
license = "MIT"
repository = "https://github.com/Prometheus-AGS/prometheus-skill-system"

[workspace.dependencies]
# Core
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Platform management
dirs = "5.0"
walkdir = "2.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
colored = "2"
regex = "1"

# GitHub API
# Repository search uses the default unauthenticated client.
octocrab = { version = "=0.54.9", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "retry",
    "rustls",
    "rustls-ring",
    "timeout",
    "tracing",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local workspace crates
prometheus-agents = { path = "crates/prometheus-agents" }
prometheus-learn = { path = "crates/prometheus-learn" }
prometheus-cedar = { path = "crates/prometheus-cedar" }
kbd-runtime = { path = "../../substrate/kbd-runtime" }

# Cedar governance
cedar-policy = "4"

# Prometheus ecosystem (git deps — optional, behind feature flags in consuming crates)
sycophancy-core = { git = "https://github.com/Know-Me-Tools/sycophancy-correction-skill.git", package = "sycophancy-core" }
dspy = { path = "vendor/dspy/crates/dspy", default-features = false, features = ["openai"] }
pk-core = { path = "../prometheus-knowledge/pk-core" }
pk-librarian = { path = "../prometheus-knowledge/pk-librarian" }
pk-store = { path = "../prometheus-knowledge/pk-store" }

[profile.release]
strip = true
lto = true
codegen-units = 1

[patch.crates-io]
heapless = { path = "../../vendor/patches/heapless-0.7.17" }
loro-internal = { path = "../../vendor/patches/loro-internal-1.13.9" }
