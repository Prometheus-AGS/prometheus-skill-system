# Modified for the Prometheus Skill System vendored optimizer. See PROVENANCE.md.
[package]
name = "dspy-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

# YAML configuration support
serde_yaml = { package = "yaml_serde", version = "=0.10.7" }
dirs = "6.0"

[dev-dependencies]
tempfile = "3.14"
